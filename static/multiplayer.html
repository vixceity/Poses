<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POSES | Online</title>
<style>
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;padding:10px 16px;background:#101923;color:#edf4fa;font-family:system-ui,sans-serif;display:flex;flex-direction:column;gap:8px}h1{margin:0;font-size:clamp(24px,3vw,42px);letter-spacing:.15em;color:#83e9ab}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar input,.bar button{font:inherit;padding:7px;border-radius:6px;border:0}.bar input{width:110px}.bar button{background:#83e9ab;cursor:pointer;font-weight:700}.status{color:#bacbd9}main{display:grid;grid-template-columns:3fr 2fr;gap:12px;min-height:0;flex:1}.panel{min-width:0;min-height:0;border:3px solid #435264;border-radius:12px;background:#172431;overflow:hidden}.panel h2{margin:8px 14px;font-size:clamp(20px,2.5vw,34px)}.camera{width:100%;height:calc(100% - 58px);display:block;object-fit:cover;background:#080d14;transform:scaleX(-1)}.target{height:calc(100% - 58px);display:grid;place-items:center;padding:12px}.target canvas{width:100%;height:100%;background:#121d28;border-radius:8px}.note{margin:0;color:#bacbd9;font-size:13px}@media(max-width:700px){main{grid-template-columns:1fr 1fr}.panel h2{font-size:18px}.note{display:none}}
</style>
<h1>POSES ONLINE</h1>
<div class="bar"><input id="room" maxlength="8" placeholder="Room code"><select id="player"><option value="1">Player 1</option><option value="2">Player 2</option></select><button id="create">Create room</button><button id="join">Join room</button><button id="ready">Ready</button><button id="start" hidden>Start game</button><span class="status" id="status">Create or join a room.</span></div>
<main><section class="panel"><h2 id="camera-title">YOUR CAMERA</h2><video id="camera" class="camera" autoplay muted playsinline></video></section><section class="panel"><h2>TARGET POSE</h2><div class="target"><canvas id="target" width="480" height="640"></canvas></div></section></main><p class="note">Your camera stays on this device. Only pose/game messages are relayed to the other player.</p>
<script>
const $=id=>document.getElementById(id);let stream=null;let lobby=null;let identity=null;let pollTimer=null;
const database=`${location.protocol==='file:'?'http:':location.protocol}//${location.hostname||'127.0.0.1'}:3000`,databaseName='poses';
async function camera(){try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});$('camera').srcObject=stream;}catch(error){$('status').textContent='Camera permission is required for online play';}}
function draw(matrix){const canvas=$('target'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);if(!matrix){ctx.fillStyle='#bacbd9';ctx.font='22px system-ui';ctx.fillText('Target will appear here',110,320);return;}const points=matrix.slice(0,12),xs=points.map(p=>p[0]),ys=points.map(p=>p[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),scale=Math.min(390/Math.max(maxX-minX,.1),540/Math.max(maxY-minY,.1)),mapped=points.map(([x,y])=>[240+(x-(minX+maxX)/2)*scale,320+(y-(minY+maxY)/2)*scale]);const edges=[[0,1],[0,2],[2,4],[1,3],[3,5],[0,6],[1,7],[6,7],[6,8],[8,10],[7,9],[9,11]];ctx.strokeStyle='#83e9ab';ctx.lineWidth=7;for(const[a,b]of edges){ctx.beginPath();ctx.moveTo(...mapped[a]);ctx.lineTo(...mapped[b]);ctx.stroke();}ctx.fillStyle='#fff';for(const[x,y]of mapped){ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();}}
async function request(path,options={}){const response=await fetch(`${database}${path}`,{...options,headers:{...(options.headers||{}),Authorization:`Bearer ${identity}`}});if(!response.ok)throw Error(await response.text());return response.json();}
async function ensureIdentity(){identity=localStorage.getItem('poses-spacetime-token');if(!identity){identity=(await fetch(`${database}/v1/identity`,{method:'POST'}).then(response=>response.json())).token;localStorage.setItem('poses-spacetime-token',identity);}}
async function call(reducer,args){return request(`/v1/database/${databaseName}/call/${reducer}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args)});}
async function sql(query){const response=await request(`/v1/database/${databaseName}/sql`,{method:'POST',headers:{'Content-Type':'text/plain'},body:query});return response[0]?.rows||[];}
function code(){return Math.random().toString(36).slice(2,8).toUpperCase();}
async function createRoom(){try{await ensureIdentity();const room=code();await call('online_create_lobby',[room]);$('room').value=room;$('player').value='1';lobby=room;setStatus(`Room ${room} created. Share the code, then click Ready.`);startPolling();}catch(error){setStatus(`Could not create lobby: ${error.message}`);}}
async function joinRoom(){try{await ensureIdentity();const room=$('room').value.trim().toUpperCase();if(!/^[A-Z0-9]{4,8}$/.test(room))throw Error('Enter a 4-8 character room code');await call('online_join_lobby',[room]);lobby=room;setStatus(`Joined room ${room}. Click Ready when you are set.`);startPolling();}catch(error){setStatus(`Could not join lobby: ${error.message}`);}}
async function setReady(){try{await call('online_set_ready',[lobby,Number($('player').value),true]);setStatus('Ready. Waiting for the other player.');}catch(error){setStatus(`Ready failed: ${error.message}`);}}
async function startGame(){try{await call('online_start_game',[lobby,.25,20]);setStatus('Game started.');}catch(error){setStatus(`Start failed: ${error.message}`);}}
function setStatus(message){$('status').textContent=message;}
async function pollState(){if(!lobby)return;try{const lobbyRows=await sql(`SELECT status, game_id FROM lobby WHERE code = '${lobby}'`);if(!lobbyRows.length)throw Error('Lobby not found');const [status,gameId]=lobbyRows[0];const players=await sql(`SELECT player, ready FROM lobby_player WHERE lobby = '${lobby}'`);const ready=players.filter(row=>String(row[1])==='true'||row[1]===true);setStatus(`${players.length}/2 players connected · ${ready.length}/2 ready`);$('start').hidden=!($('player').value==='1'&&ready.length===2&&status==='ready');if(gameId){const gameRows=await sql(`SELECT state FROM game WHERE id = '${gameId}'`);if(gameRows.length){const game=JSON.parse(gameRows[0][0]);const target=['ready','copying'].includes(game.phase)?game.poses[game.index]:null;draw(target);}}}catch(error){setStatus(`SpacetimeDB: ${error.message}`);}}
function startPolling(){clearInterval(pollTimer);pollState();pollTimer=setInterval(pollState,700);}
$('create').onclick=createRoom;$('join').onclick=joinRoom;$('ready').onclick=setReady;$('start').onclick=startGame;camera();draw(null);
</script>
</html>
