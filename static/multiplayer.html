<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POSES | Online</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&family=Protest+Guerrilla&display=swap');
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow:hidden}
body{min-height:100vh;background:#061a30;color:#fff;font-family:Inter,Arial,sans-serif}
.scene{position:relative;display:flex;min-height:100vh;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(135deg,#0a2540,#0d3a68 52%,#061a30)}
.scene:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(95,200,235,.32),transparent 45%),linear-gradient(90deg,rgba(6,26,48,.9),rgba(6,26,48,.4) 45%,rgba(6,26,48,.6));}
.silhouette{position:absolute;left:50%;bottom:3%;width:min(48vw,520px);height:88%;transform:translateX(-50%);opacity:.4;background:radial-gradient(ellipse at center 30%,rgba(95,200,235,.45),transparent 62%);clip-path:polygon(47% 0,58% 0,63% 10%,60% 18%,70% 24%,82% 42%,75% 48%,68% 35%,65% 100%,54% 100%,51% 58%,48% 58%,45% 100%,34% 100%,38% 35%,25% 48%,18% 42%,30% 24%,40% 18%,37% 10%,42% 0)}
.tracking{position:absolute;inset:12% 33% 10%;border:1px solid rgba(95,200,235,.65);border-radius:8px}
.tracking:before{content:'LOCAL CAMERA';position:absolute;top:-25px;left:0;padding:4px 8px;background:rgba(95,200,235,.15);color:#5fc8eb;font:600 10px monospace;letter-spacing:.14em}
.tracking:after{content:'';position:absolute;left:50%;top:0;width:1px;height:100%;background:rgba(95,200,235,.45);box-shadow:0 0 0 1px rgba(95,200,235,.1)}
.hud{position:absolute;inset:24px;color:rgba(95,200,235,.6);pointer-events:none}
.hud:before,.hud:after{content:'';position:absolute;width:32px;height:32px;border-color:currentColor;border-style:solid}
.hud:before{left:0;top:0;border-width:2px 0 0 2px}.hud:after{right:0;bottom:0;border-width:0 2px 2px 0}
.rec{position:absolute;right:24px;top:24px;z-index:2;color:#5fc8eb;font:600 11px monospace;letter-spacing:.16em}.rec b{display:inline-block;width:10px;height:10px;margin-right:8px;border-radius:50%;background:#d62828}
.base-panel{position:relative;z-index:2;width:min(84vw,1100px);display:flex;flex-direction:column;gap:18px;padding:24px;background:rgba(13,17,25,.35);backdrop-filter:blur(8px);border:2px solid rgba(95,200,235,.25);border-radius:20px;box-shadow:0 20px 60px rgba(2,6,12,.35)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.title{margin:0;font-size:clamp(28px,4vw,52px);letter-spacing:.12em;color:#83e9ab;font-family:'Archivo Black',sans-serif}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.control-input,.control-select,.control-button{font:inherit;border-radius:10px;border:2px solid #0f0f0f;padding:10px 14px}
.control-input,.control-select{background:rgba(15,15,15,.24);color:white;min-width:120px}
.control-button{background:#efd31e;color:#0f0f0f;font-weight:800;cursor:pointer;box-shadow:4px 5px 0 #0f0f0f;transition:transform .15s,background .15s}
.control-button:hover{background:#f28c28;transform:translateY(-2px)}
.status{color:#bacbd9;font:600 12px monospace;letter-spacing:.12em;text-transform:uppercase}
.session{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:470px}
.panel{position:relative;min-height:0;border:3px solid rgba(95,200,235,.35);border-radius:18px;background:#172431;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.panel h2{margin:12px 14px 8px;font-size:clamp(20px,2vw,32px);letter-spacing:.12em;color:rgba(255,255,255,.9);text-transform:uppercase}
.camera{display:block;width:100%;height:calc(100% - 60px);object-fit:cover;background:#080d14;transform:scaleX(-1)}
.peer{display:block;width:100%;height:calc(100% - 60px);object-fit:cover;background:#080d14;transform:scaleX(-1)}
.label-strip{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;z-index:2;padding:8px 12px;border-radius:10px;background:rgba(6,26,48,.64);border:1px solid rgba(95,200,235,.25);font:600 12px monospace;letter-spacing:.12em;text-transform:uppercase;color:#5fc8eb}
@media(max-width:820px){.session{grid-template-columns:1fr}.base-panel{width:92vw;padding:16px}.title{font-size:36px}}
</style>
</head>
<body>
<main class="scene">
  <div class="silhouette" aria-hidden="true"></div>
  <div class="tracking" aria-hidden="true"></div>
  <div class="hud" aria-hidden="true"></div>
  <div class="rec"><b></b>REC &nbsp; CAMERA FEED</div>

  <section class="base-panel">
    <div class="topbar">
      <h1 class="title">POSES ONLINE</h1>
      <div class="controls">
        <input id="room" class="control-input" maxlength="8" placeholder="Room code" aria-label="Room code">
        <select id="player" class="control-select" aria-label="Player number">
          <option value="1">Player 1</option>
          <option value="2">Player 2</option>
        </select>
        <button id="create" class="control-button">Create room</button>
        <button id="join" class="control-button">Join room</button>
        <button id="ready" class="control-button">Ready</button>
        <button id="start" class="control-button" hidden>Start game</button>
      </div>
    </div>
    <div class="status" id="status">Create or join a room.</div>
    <div class="session">
      <article class="panel">
        <h2>Local camera</h2>
        <video id="camera" class="camera" autoplay muted playsinline></video>
        <div class="label-strip"><span>You</span><span id="local-label">PLAYER 1</span></div>
      </article>
      <article class="panel">
        <h2>Opponent</h2>
        <video id="peer-camera" class="peer" autoplay playsinline></video>
        <div class="label-strip"><span>Peer</span><span id="peer-label">WAITING</span></div>
      </article>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const roomInput = $('room');
const playerSelect = $('player');
const localVideo = $('camera');
const peerVideo = $('peer-camera');
const localLabel = $('local-label');
const peerLabel = $('peer-label');

let localStream = null;
let websocket = null;
let localPlayer = '1';
let roomCode = null;
let peerConnections = new Map();
let isReady = false;

const iceServers = [{
  urls: [
    'stun:stun.l.google.com:19302',
    'stun:stun1.l.google.com:19302'
  ]
}];

function setStatus(message) {
  $('status').textContent = message;
}

function updatePlayerLabel() {
  localPlayer = playerSelect.value;
  localLabel.textContent = `PLAYER ${localPlayer}`;
  peerLabel.textContent = roomCode ? `PLAYER ${localPlayer === '1' ? '2' : '1'}` : 'WAITING';
}

async function startLocalCamera() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    localVideo.srcObject = localStream;
    setStatus('Camera ready. Create or join a room.');
  } catch (error) {
    setStatus('Camera permission is required for online play.');
    console.error(error);
  }
}

function ensureSocket() {
  if (websocket && websocket.readyState === WebSocket.OPEN) {
    return;
  }
  const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
  const host = location.hostname || '127.0.0.1';
  websocket = new WebSocket(`${protocol}://${host}:8001/ws/${roomCode}/${localPlayer}`);

  websocket.onopen = () => {
    setStatus(`Connected to room ${roomCode}. Waiting for the other player.`);
  };

  websocket.onmessage = async (event) => {
    const message = JSON.parse(event.data);
    if (!message || !message.player) return;

    if (message.type === 'state') {
      const players = message.players || [];
      if (players.length >= 2) {
        peerLabel.textContent = players.find((player) => player !== localPlayer) ? `PLAYER ${players.find((player) => player !== localPlayer)}` : 'READY';
      }
      return;
    }

    if (message.player === localPlayer) return;

    if (message.type === 'offer') {
      const pc = getPeerConnection(message.player);
      await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: message.sdp }));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      websocket.send(JSON.stringify({ type: 'answer', target: message.player, sdp: answer.sdp }));
      return;
    }

    if (message.type === 'answer') {
      const pc = getPeerConnection(message.player);
      await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: message.sdp }));
      return;
    }

    if (message.type === 'candidate') {
      const pc = getPeerConnection(message.player);
      if (pc && message.candidate) {
        await pc.addIceCandidate(new RTCIceCandidate(message.candidate));
      }
      return;
    }
  };

  websocket.onclose = () => {
    if (roomCode) {
      setStatus(`Disconnected from room ${roomCode}.`);
    }
  };

  websocket.onerror = () => {
    setStatus('WebSocket error. Check the multiplayer relay server.');
  };
}

function sendSignal(type, payload) {
  if (!websocket || websocket.readyState !== WebSocket.OPEN) return;
  websocket.send(JSON.stringify({ type, ...payload }));
}

function getPeerConnection(playerId) {
  let pc = peerConnections.get(playerId);
  if (!pc && localStream) {
    pc = new RTCPeerConnection({ iceServers });
    localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));

    pc.ontrack = (event) => {
      const [remoteStream] = event.streams;
      if (remoteStream) {
        peerVideo.srcObject = remoteStream;
      }
    };

    pc.onicecandidate = (event) => {
      if (!event.candidate) return;
      sendSignal('candidate', { target: playerId, candidate: event.candidate.toJSON() });
    };

    peerConnections.set(playerId, pc);
  }
  return pc;
}

async function createRoom() {
  try {
    const response = await fetch('http://127.0.0.1:8001/api/rooms', { method: 'POST' });
    if (!response.ok) {
      throw new Error('Unable to create room');
    }
    const data = await response.json();
    roomCode = data.room;
    roomInput.value = roomCode;
    playerSelect.value = '1';
    updatePlayerLabel();
    ensureSocket();
    setStatus(`Room ${roomCode} created. Share the code, then click Ready.`);
  } catch (error) {
    setStatus(`Could not create a room: ${error.message}`);
  }
}

async function joinRoom() {
  roomCode = roomInput.value.trim().toUpperCase();
  if (!/^[A-Z0-9]{4,8}$/.test(roomCode)) {
    setStatus('Enter a valid room code.');
    return;
  }
  playerSelect.value = '2';
  updatePlayerLabel();
  ensureSocket();
  setStatus(`Joining room ${roomCode}.`);
}

async function setReady() {
  if (!roomCode) {
    setStatus('Create or join a room first.');
    return;
  }
  isReady = true;
  sendSignal('ready', { room: roomCode, ready: true });
  setStatus(`Ready in room ${roomCode}. Waiting for the other player.`);
}

async function startGame() {
  if (!roomCode) {
    setStatus('Create or join a room first.');
    return;
  }
  sendSignal('start', { room: roomCode, start: true });
}

async function onPlayerChange() {
  updatePlayerLabel();
  if (!roomCode) return;
  if (websocket) {
    websocket.close();
  }
  ensureSocket();
}

playerSelect.addEventListener('change', onPlayerChange);
$('create').addEventListener('click', createRoom);
$('join').addEventListener('click', joinRoom);
$('ready').addEventListener('click', setReady);
$('start').addEventListener('click', startGame);

updatePlayerLabel();
startLocalCamera();
</script>
</body>
</html>
